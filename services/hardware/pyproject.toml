[project]
name = "wishpix-hardware"
version = "1.0.0"
description = "WishPix kiosk hardware service: page layout and printing (CUPS inkjet or ESC/POS thermal)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.18",
  "pydantic-settings>=2.6",
  "pillow>=11.0",
  "opencv-python-headless>=4.10",
  "numpy>=2.0",
  "pypdfium2>=4.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
