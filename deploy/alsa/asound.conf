# ALSA defaults for the WishPix kiosk: record from the USB microphone,
# play sounds on the 3.5 mm jack (the Creative Pebble speakers).
# Check card numbers with `arecord -l` and `aplay -l`, then adjust.

pcm.!default {
  type asym
  capture.pcm "mic"
  playback.pcm "speaker"
}

pcm.mic {
  type plug
  slave.pcm "hw:CARD=Device,DEV=0"   # USB microphone (often named "Device")
}

pcm.speaker {
  type plug
  slave.pcm "hw:CARD=Headphones,DEV=0"   # Pi 4 3.5 mm jack
}

ctl.!default {
  type hw
  card Headphones
}
