# Optional: serve the Teacher App on port 80 (http://wishpix.local/teacher).
# The kiosk screen keeps using http://localhost:3000 directly; requests that
# come through this proxy carry X-Real-IP, so they can never act as the kiosk.
server {
  listen 80 default_server;
  server_name _;
  client_max_body_size 10m;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Socket.IO live updates
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1h;
  }

  # The kiosk-only API is never reachable through the proxy.
  location /api/device/ {
    return 403;
  }
}
